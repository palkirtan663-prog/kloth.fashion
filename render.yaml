services:
  - type: web
    name: kloth-fashion
    env: node
    plan: free
    buildCommand: npm --prefix urbanthread-ai install && npm --prefix urbanthread-ai/server install && npm --prefix urbanthread-ai/client install && npm --prefix urbanthread-ai run build
    startCommand: npm --prefix urbanthread-ai/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_SEED_PRODUCTS
        value: "true"

